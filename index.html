<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma de construcción y orquestación de agentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ==========================================================================
   Plataforma de construcción y orquestación de agentes · Sistema de diseño
   Tokens (FRD §5.2 y §5.3). Cambiar de marca solo exige cambiar los tokens (UX-01).
   ========================================================================== */
:root{
  /* Color */
  --e:#001391;          /* Azul BBVA: acciones, enlaces, selección */
  --m:#070E46;          /* Azul marino: titulares y texto principal */
  --blue-light:#E8EBFF; /* Fondos suaves, hover */
  --sand:#F7F8F8;       /* Fondo de página */
  --w:#FFFFFF;          /* Superficie de cards */
  --border:#E2E8F0;     /* Bordes neutros */
  --muted:#5C6A8A;      /* Texto secundario */
  --aqua:#8BE1E9;       /* Acento informativo: sandbox, trazabilidad */
  --lime:#88E783;       /* Acento positivo */
  --mand:#FFB56B;       /* Acento de atención */
  --purp:#9694FF;       /* Acento de orquestación */
  --green:#1A9E6E;      /* Estado: éxito */
  --amber:#D97706;      /* Estado: aviso */
  --red:#C8283A;        /* Estado: error */
  /* Tintes de estado y acento (fondo suave + texto oscuro, §5.2) */
  --green-bg:#E3F5EE; --green-tx:#0F6B49;
  --amber-bg:#FDF0DC; --amber-tx:#7A4300;
  --red-bg:#FBE6E9;   --red-tx:#9E1B2C;
  --aqua-bg:#E4F8FA;  --aqua-tx:#0B6370;
  --purp-bg:#EEEEFF;  --purp-tx:#3D3BB0;
  --gray-bg:#EEF1F5;  --gray-tx:#4A5674;
  /* Forma */
  --r8:8px; --r16:16px; --r20:20px; --rpill:999px;
  --sh:0 1px 2px rgba(7,14,70,.05),0 2px 8px rgba(7,14,70,.05);
  --sh-hover:0 4px 18px rgba(7,14,70,.10);
  --sh-modal:0 24px 64px rgba(7,14,70,.22);
  /* Espaciado (rejilla de 8 px) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:40px;
  /* Tipografía */
  --f-ui:'Lato',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-head:'Source Serif 4',Georgia,'Times New Roman',serif;
  --f-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --focus:0 0 0 3px rgba(0,19,145,.35);
  --topbar-h:104px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-size-adjust:100%}
body{font-family:var(--f-ui);font-size:14px;line-height:22px;background:var(--sand);color:var(--m);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--e)}
code,.mono{font-family:var(--f-mono);font-size:12px}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r8)}
.num,.tnum,td.num{font-variant-numeric:tabular-nums}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hide{display:none!important}

/* Iconos: set único lineal de 24 px y trazo uniforme (UX, HOME-07) */
.ic{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ic.s16{width:16px;height:16px}.ic.s24{width:24px;height:24px}.ic.s14{width:14px;height:14px}

/* Texto */
.t-muted{color:var(--muted)}.t-sm{font-size:12px;line-height:16px}.t-xs{font-size:11px;line-height:14px}
.t-b{font-weight:700}.t-bb{font-weight:900}
.t-trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.overline{font-size:11px;line-height:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.t-ok{color:var(--green-tx)}.t-warn{color:var(--amber-tx)}.t-err{color:var(--red-tx)}
h1,h2,h3{font-weight:600;color:var(--m)}
.h-page{font-family:var(--f-head);font-size:20px;line-height:28px;font-weight:600}
.h-card{font-size:14px;line-height:20px;font-weight:700}

/* ── ACCESO ─────────────────────────────────────────────────────────────── */
#login-ov{position:fixed;inset:0;background:radial-gradient(circle at 30% 20%,var(--e),var(--m));z-index:900;display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{background:var(--w);border-radius:var(--r20);padding:40px 32px;width:420px;max-width:100%;box-shadow:var(--sh-modal)}
.login-mark{width:56px;height:56px;border-radius:var(--r16);background:var(--e);color:var(--w);display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.login-card h1{font-family:var(--f-head);font-size:24px;line-height:32px;margin-bottom:4px}
.login-card .t-muted{margin-bottom:24px}
.demo-flag{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:var(--r8);background:var(--amber-bg);color:var(--amber-tx);font-size:11px;font-weight:700;line-height:16px}

/* ── CABECERO (NAV-01) ─────────────────────────────────────────────────── */
#topbar{position:sticky;top:0;background:var(--m);z-index:300;color:var(--w)}
.tb-row1{display:flex;align-items:center;gap:var(--s3);height:60px;padding:0 var(--s5)}
.tb-row2{display:flex;align-items:center;height:44px;padding:0 var(--s5);background:#0B1565;border-top:1px solid rgba(255,255,255,.1)}
#tb-brand{display:flex;align-items:center;gap:var(--s3);text-decoration:none;color:var(--w);flex-shrink:0;cursor:pointer;border-radius:var(--r8);padding:4px}
#tb-brand img{height:20px;display:block}
#tb-brand .div{width:1px;height:24px;background:rgba(255,255,255,.2)}
#tb-brand .name{font-size:14px;line-height:20px;font-weight:600;white-space:nowrap;flex-shrink:0}
#tb-brand .name-wrap{display:flex;flex-direction:column;flex-shrink:0}
#tb-brand .sub{font-size:11px;line-height:14px;font-weight:400;color:rgba(255,255,255,.65);white-space:nowrap;letter-spacing:.02em}
#nav{display:flex;align-items:center;gap:2px}
.nv{position:relative}
.nv-btn{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border:0;border-radius:var(--r8);background:transparent;color:rgba(255,255,255,.72);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.nv-btn:hover,.nv.open .nv-btn{background:rgba(255,255,255,.09);color:var(--w)}
.nv.active .nv-btn{color:var(--w);background:rgba(255,255,255,.14);box-shadow:inset 0 -2px 0 var(--aqua)}
.nv-btn .ic.chev{width:14px;height:14px;opacity:.7}
.dd{position:absolute;top:calc(100% + 6px);left:0;min-width:260px;background:var(--w);color:var(--m);border:1px solid var(--border);border-radius:var(--r16);box-shadow:var(--sh-modal);padding:var(--s2);display:none;z-index:400}
.nv.open .dd{display:block}
.dd-ctx{padding:6px 10px 10px;margin-bottom:4px;border-bottom:1px solid var(--border);font-size:12px;line-height:16px;font-weight:700;color:var(--muted)}
.dd-item{display:flex;align-items:center;gap:var(--s3);width:100%;padding:10px;border:0;background:none;border-radius:var(--r8);text-align:left;cursor:pointer;color:var(--m)}
.dd-item:hover,.dd-item.active{background:var(--blue-light)}
.dd-item .dd-ic{width:36px;height:36px;border-radius:50%;background:var(--sand);display:flex;align-items:center;justify-content:center;color:var(--e);flex-shrink:0}
.dd-item .dd-n{font-size:13px;line-height:18px;font-weight:700}
.dd-item .dd-s{font-size:12px;line-height:16px;color:var(--muted)}
.dd-item .count{margin-left:auto}
#tb-user .cname{display:flex;flex-direction:column;line-height:14px;text-align:left}
.tb-spacer{flex:1}
.tb-ctrl{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:var(--r8);border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--w);cursor:pointer;font-size:12px;font-weight:700;position:relative;white-space:nowrap}
.tb-ctrl:hover{background:rgba(255,255,255,.12)}
.tb-ctrl[aria-disabled="true"]{cursor:default;opacity:.85}
#tb-search{cursor:pointer;padding:0 10px;gap:0;flex-shrink:0}
#tb-search input{background:transparent;border:0;outline:none;color:var(--w);width:0;opacity:0;padding:0;font-size:12px;transition:width .2s,opacity .2s,margin .2s}
#tb-search:focus-within{cursor:text}
#tb-search:focus-within input{width:190px;opacity:1;margin-left:8px}
#tb-search input::placeholder{color:rgba(255,255,255,.55)}
#tb-search:focus-within{border-color:var(--aqua)}
.tb-dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:var(--rpill);background:var(--red);color:var(--w);font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid var(--m)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--e);color:var(--w);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0}
#tb-menu-btn{display:none}
.popover{position:absolute;top:calc(100% + 8px);right:0;width:340px;max-width:calc(100vw - 32px);background:var(--w);color:var(--m);border:1px solid var(--border);border-radius:var(--r16);box-shadow:var(--sh-modal);z-index:450;padding:var(--s2);display:none;cursor:default;font-weight:400;font-size:14px;white-space:normal}
.popover.open{display:block}
.pop-head{padding:8px 10px 10px;border-bottom:1px solid var(--border);margin-bottom:6px}
.pop-item{display:flex;align-items:flex-start;gap:10px;width:100%;padding:10px;border:0;background:none;border-radius:var(--r8);text-align:left;cursor:pointer;color:var(--m)}
.pop-item:hover{background:var(--blue-light)}
.pop-item[disabled]{cursor:not-allowed;opacity:.55}
.pop-item[disabled]:hover{background:none}
.pop-item.sel{background:var(--blue-light)}

/* Banderas simplificadas (sin emojis) */
.flag{display:inline-block;width:20px;height:14px;border-radius:3px;box-shadow:0 0 0 1px rgba(7,14,70,.18);flex-shrink:0;vertical-align:middle}
.flag-ESP{background:linear-gradient(#AA151B 0 25%,#F1BF00 25% 75%,#AA151B 75%)}
.flag-MEX{background:linear-gradient(90deg,#006847 0 33.3%,#fff 33.3% 66.6%,#CE1126 66.6%)}
.flag-ARG{background:linear-gradient(#74ACDF 0 33.3%,#fff 33.3% 66.6%,#74ACDF 66.6%)}
.flag-COL{background:linear-gradient(#FCD116 0 50%,#003893 50% 75%,#CE1126 75%)}
.flag-CHI{background:linear-gradient(90deg,#0039A6 0 34%,transparent 34%),linear-gradient(#fff 0 50%,#D52B1E 50%);background-size:100% 50%,100% 100%;background-repeat:no-repeat}
.flag-PER{background:linear-gradient(90deg,#D91023 0 33.3%,#fff 33.3% 66.6%,#D91023 66.6%)}
.flag-ALL{background:var(--blue-light);display:inline-flex;align-items:center;justify-content:center;color:var(--e)}

/* ── LAYOUT ─────────────────────────────────────────────────────────────── */
#main{max-width:1440px;margin:0 auto;padding:var(--s5)}
#view{transition:opacity .18s}
#view.fading{opacity:.35}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s5)}
.page-head .ph-l{min-width:0;flex:1 1 360px}
.page-meta{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-top:6px}
.page-sub{color:var(--muted);margin-top:2px;max-width:760px}
.page-actions{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:4px;font-size:12px;line-height:16px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.crumbs button{border:0;background:none;color:var(--e);cursor:pointer;font-weight:700;font-size:12px;padding:0}
.viewing{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 6px;border-radius:var(--rpill);background:var(--w);border:1px solid var(--border);font-size:12px;line-height:20px;font-weight:700}
.fresh{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;color:var(--muted)}
.help-box{background:var(--blue-light);border-radius:var(--r16);padding:var(--s4) var(--s5);margin-bottom:var(--s5);font-size:13px;line-height:20px}
.help-box dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin-top:8px}
.help-box dt{font-weight:700}
.block-title{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin:var(--s6) 0 var(--s4)}
.block-title:first-child{margin-top:0}
.block-title h2{font-family:var(--f-head);font-size:18px;line-height:24px}

/* Rejillas (HOME-05: 12 columnas, separación 24 px) */
.grid12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--s5)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
.grid{display:grid;gap:var(--s5)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:var(--s5)}
.row{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.top{align-items:flex-start}
.gap4{gap:var(--s4)}.gap5{gap:var(--s5)}.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}
.grow{flex:1;min-width:0}

/* ── CARD (UX-02) ───────────────────────────────────────────────────────── */
.card{background:var(--w);border:1px solid var(--border);border-radius:var(--r16);padding:var(--s5);box-shadow:var(--sh);min-width:0}
.card.flush{padding:0}
.card.flush .card-h{padding:var(--s4) var(--s5);margin:0;border-bottom:1px solid var(--border)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4)}
.card-h .ttl{display:flex;align-items:center;gap:var(--s2);min-width:0}
.card-h h3{font-size:14px;line-height:20px;font-weight:700}
.card + .card{margin-top:var(--s5)}
.stack > .card + .card,.grid > .card + .card,.grid12 > .card + .card{margin-top:0}
.ic-round{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--blue-light);color:var(--e)}
.ic-round.sm{width:32px;height:32px}
.ic-round.aqua{background:var(--aqua-bg);color:var(--aqua-tx)}.ic-round.purp{background:var(--purp-bg);color:var(--purp-tx)}
.ic-round.lime{background:var(--green-bg);color:var(--green-tx)}.ic-round.mand{background:var(--amber-bg);color:var(--amber-tx)}
.ic-round.red{background:var(--red-bg);color:var(--red-tx)}.ic-round.gray{background:var(--gray-bg);color:var(--gray-tx)}

/* ── TILE: anatomía §7.1 (HOME-03..07) ─────────────────────────────────── */
.tile{background:var(--w);border:1px solid var(--border);border-radius:var(--r16);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3);min-height:212px;cursor:pointer;transition:box-shadow .15s,border-color .15s;text-align:left;min-width:0;position:relative}
.tile:hover{box-shadow:var(--sh-hover);border-color:#C9D2E3}
.tile:focus-visible{box-shadow:var(--focus)}
.tile-h{display:flex;align-items:center;gap:var(--s3);min-width:0}
.tile-h .h-card{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.tile-mrow .state{flex-shrink:0}
.tile-metric{font-size:36px;line-height:40px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--m);letter-spacing:-.01em;border:0;background:none;padding:0;cursor:pointer;text-align:left;align-self:flex-start;border-radius:var(--r8)}
.tile-metric .unit{font-size:20px;font-weight:700;margin-left:2px}
.tile-metric .of{font-size:20px;font-weight:700;color:var(--muted)}
.tile-desc{font-size:12px;line-height:16px;color:var(--muted);margin-top:-6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-support{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);padding-top:var(--s3);border-top:1px solid var(--border)}
.tile-support .sup-l{font-size:12px;line-height:16px;color:var(--muted)}
.tile-support .sup-v{font-size:14px;line-height:20px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;min-width:0}
.tile-support button.sup-v{border:0;background:none;padding:0;cursor:pointer;color:var(--m);text-align:left;border-radius:var(--r8)}
.tile-support button.sup-v:hover{color:var(--e);text-decoration:underline}
.tile-cta{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--e)}
.tile-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin-top:auto}
.tile.compact{min-height:0;flex-direction:row;align-items:center;gap:var(--s3);padding:var(--s4)}
.tile.compact .tc-body{min-width:0;flex:1}
.tile.compact .tc-v{font-size:20px;line-height:28px;font-weight:700;font-variant-numeric:tabular-nums}
.tile.compact .tc-v.small{font-size:14px;line-height:20px}
.tile.compact input{width:100%}
.seg-bar{display:flex;height:12px;border-radius:var(--rpill);overflow:hidden;background:var(--gray-bg);gap:2px}
.seg-bar span{display:block;height:100%}
.seg-legend{display:flex;flex-wrap:wrap;gap:6px 16px}
.seg-legend button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;cursor:pointer;font-size:12px;line-height:16px;color:var(--m);border-radius:var(--r8)}
.seg-legend button:hover{text-decoration:underline}
.seg-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.seg-legend b{font-variant-numeric:tabular-nums}

/* ── KPI / STAT ─────────────────────────────────────────────────────────── */
.kpi{background:var(--w);border:1px solid var(--border);border-radius:var(--r16);padding:var(--s4) var(--s5);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi.click{cursor:pointer}.kpi.click:hover{box-shadow:var(--sh-hover)}
.kpi .k-l{font-size:12px;line-height:16px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .k-v{font-size:28px;line-height:36px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:12px;line-height:16px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--s4);margin-bottom:var(--s5)}

/* ── BADGE / CHIP (UX-02) ───────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:var(--r8);font-size:12px;line-height:16px;font-weight:700;white-space:nowrap;background:var(--gray-bg);color:var(--gray-tx)}
.badge .ic{width:14px;height:14px;stroke-width:2}
.b-ok{background:var(--green-bg);color:var(--green-tx)}.b-warn{background:var(--amber-bg);color:var(--amber-tx)}.b-err{background:var(--red-bg);color:var(--red-tx)}
.b-info{background:var(--aqua-bg);color:var(--aqua-tx)}.b-orq{background:var(--purp-bg);color:var(--purp-tx)}.b-blue{background:var(--blue-light);color:var(--e)}.b-gray{background:var(--gray-bg);color:var(--gray-tx)}
.badge.outline{background:var(--w);border:1px solid var(--border);color:var(--m)}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:var(--rpill);background:var(--blue-light);color:var(--e);font-size:12px;line-height:16px;font-weight:700;white-space:nowrap;border:0}
.chip.btn-chip{cursor:pointer}.chip.btn-chip:hover{background:#d8ddff}
.chip.on{background:var(--e);color:var(--w)}
.chip.neutral{background:var(--gray-bg);color:var(--gray-tx)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:var(--rpill);background:var(--red);color:var(--w);font-size:11px;font-weight:900;font-variant-numeric:tabular-nums}
.count.neutral{background:var(--gray-bg);color:var(--gray-tx)}
.lock-note{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}

/* ── BOTONES (uno primario por vista) ───────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r8);border:1px solid transparent;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
.btn .ic{width:18px;height:18px}
.btn-p{background:var(--e);color:var(--w)}.btn-p:hover{background:#000E6E}
.btn-s{background:var(--w);color:var(--m);border-color:var(--border)}.btn-s:hover{border-color:var(--e);color:var(--e)}
.btn-d{background:var(--red);color:var(--w)}.btn-d:hover{background:#A51F30}
.btn-ds{background:var(--w);color:var(--red-tx);border-color:#F0C2C9}.btn-ds:hover{border-color:var(--red)}
.btn-ok{background:var(--w);color:var(--green-tx);border-color:#BDE5D5}.btn-ok:hover{border-color:var(--green)}
.btn-t{background:none;border:0;color:var(--e);padding:0 4px;height:auto;font-size:13px}
.btn-t:hover{text-decoration:underline}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.btn-xs{height:28px;padding:0 10px;font-size:12px;gap:6px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn-icon{width:36px;height:36px;padding:0}
.btn-group{display:inline-flex;gap:var(--s2);flex-wrap:wrap}

/* ── FORMULARIOS ────────────────────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--s4);min-width:0}
.field > label,.lbl{font-size:12px;line-height:16px;font-weight:700;color:var(--m)}
.field .hint{font-size:12px;line-height:16px;color:var(--muted)}
.field .err-msg{font-size:12px;line-height:16px;color:var(--red-tx);display:flex;align-items:center;gap:4px}
.req::after{content:' *';color:var(--red-tx)}
.inp{height:40px;border:1px solid #CBD3E1;border-radius:var(--r8);padding:0 12px;background:var(--w);color:var(--m);font-size:14px;width:100%;min-width:0;transition:border-color .12s}
textarea.inp{height:auto;min-height:88px;padding:10px 12px;resize:vertical;line-height:20px}
textarea.inp.code{font-family:var(--f-mono);font-size:12px}
.inp:focus{outline:none;border-color:var(--e);box-shadow:var(--focus)}
.inp.invalid{border-color:var(--red)}
.inp[readonly]{background:var(--sand)}
select.inp{padding-right:8px}
.inp-sm{height:32px;font-size:13px}
.check{display:flex;align-items:flex-start;gap:8px;font-size:14px;line-height:20px;cursor:pointer}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--e);flex-shrink:0}
.radio-cards{display:grid;gap:var(--s3)}
.radio-card{display:flex;gap:var(--s3);padding:var(--s4);border:1px solid var(--border);border-radius:var(--r16);cursor:pointer;background:var(--w)}
.radio-card:hover{border-color:#B9C3D8}
.radio-card.sel{border-color:var(--e);background:var(--blue-light)}
.radio-card.dis{opacity:.5;cursor:not-allowed}
.radio-card input{accent-color:var(--e);margin-top:4px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s3);align-items:end}
.filters .field{margin-bottom:0}
.search-inp{position:relative}
.search-inp .ic{position:absolute;left:12px;top:10px;color:var(--muted)}
.search-inp .inp{padding-left:38px}
.toggle{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle .tr{width:40px;height:22px;border-radius:var(--rpill);background:#CBD3E1;position:relative;transition:background .15s;flex-shrink:0}
.toggle .tr::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--w);transition:left .15s}
.toggle input:checked + .tr{background:var(--e)}
.toggle input:checked + .tr::after{left:21px}
.toggle input:focus-visible + .tr{box-shadow:var(--focus)}

/* ── TABLA (cabecera fija, cifras a la derecha) ─────────────────────────── */
.tbl-wrap{overflow:auto;max-height:640px;border-radius:0 0 var(--r16) var(--r16)}
.tbl-wrap.short{max-height:420px}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;line-height:20px}
.tbl th{position:sticky;top:0;z-index:1;background:var(--sand);text-align:left;padding:10px 12px;font-size:12px;line-height:16px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--m)}
.tbl td{padding:0 12px;height:52px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#FAFBFF}
.tbl tr.clickable{cursor:pointer}
.tbl tr.sel td{background:var(--blue-light)}
.tbl th.num,.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .cell-main{font-weight:700;color:var(--m)}
.tbl .cell-sub{font-size:12px;line-height:16px;color:var(--muted)}
.tbl td.actions{white-space:nowrap;text-align:right}
.link{border:0;background:none;padding:0;color:var(--e);font-weight:700;cursor:pointer;text-align:left;font-size:inherit;border-radius:4px}
.link:hover{text-decoration:underline}
.pager{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s3) var(--s5);border-top:1px solid var(--border);flex-wrap:wrap}
.bulk-bar{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;padding:var(--s3) var(--s5);background:var(--blue-light);border-bottom:1px solid var(--border)}

/* ── ESTADOS DE VISTA (UX-03) ───────────────────────────────────────────── */
.skel{background:linear-gradient(90deg,#EEF1F5 0%,#F7F8FA 50%,#EEF1F5 100%);background-size:200% 100%;animation:skel 1.2s infinite linear;border-radius:var(--r8)}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-line{height:14px;margin:8px 0}
.skel-metric{height:40px;width:40%;margin:8px 0}
.state-box{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--s2);padding:var(--s6) var(--s4);color:var(--muted);min-height:120px}
.state-box .ic{width:28px;height:28px}
.state-box .st-t{font-weight:700;color:var(--m)}
.state-box.err .ic{color:var(--red)}
.state-box.ok .ic{color:var(--green)}
.state-inline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

/* ── AVISOS ─────────────────────────────────────────────────────────────── */
.note{display:flex;gap:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r8);background:var(--sand);border:1px solid var(--border);font-size:13px;line-height:20px}
.note .ic{margin-top:1px}
.note .n-t{font-weight:700}
.note.info{background:var(--blue-light);border-color:#CDD4FF}.note.info .ic{color:var(--e)}
.note.ok{background:var(--green-bg);border-color:#BDE5D5}.note.ok .ic{color:var(--green)}
.note.warn{background:var(--amber-bg);border-color:#F4D3A6}.note.warn .ic{color:var(--amber)}
.note.err{background:var(--red-bg);border-color:#F0C2C9}.note.err .ic{color:var(--red)}
.note + .note{margin-top:var(--s2)}

/* ── LISTAS / KV ────────────────────────────────────────────────────────── */
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--s4) var(--s5)}
.kv .k{font-size:12px;line-height:16px;color:var(--muted)}
.kv .v{font-size:14px;line-height:20px;font-weight:700;overflow-wrap:anywhere}
.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--border);min-width:0}
.list-item:last-child{border-bottom:0}
.list-item.click{cursor:pointer;padding-left:8px;padding-right:8px;border-radius:var(--r8)}
.list-item.click:hover{background:var(--sand)}
.list-item.sel{background:var(--blue-light)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.code-box{background:#0B1020;color:#C9F3DF;border-radius:var(--r8);padding:var(--s4);font-family:var(--f-mono);font-size:12px;line-height:18px;white-space:pre-wrap;overflow:auto;max-height:420px}
.code-box .k{color:#8BE1E9}.code-box .c{color:#7E8BAE}.code-box .ok{color:#88E783}.code-box .er{color:#FF9AA5}
.timeline{position:relative;padding-left:28px}
.timeline::before{content:'';position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl-i{position:relative;padding-bottom:var(--s4)}
.tl-i:last-child{padding-bottom:0}
.tl-i .tl-dot{position:absolute;left:-28px;top:0;width:24px;height:24px;border-radius:50%;background:var(--w);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tl-i .tl-dot .ic{width:12px;height:12px;stroke-width:2.5}
.tl-i.done .tl-dot{background:var(--green);border-color:var(--green);color:var(--w)}
.tl-i.cur .tl-dot{border-color:var(--e);color:var(--e)}
.tl-i.warn .tl-dot{background:var(--amber-bg);border-color:var(--amber);color:var(--amber-tx)}
.tl-i.err .tl-dot{background:var(--red-bg);border-color:var(--red);color:var(--red-tx)}
.tl-t{font-weight:700}
.tl-d{font-size:12px;line-height:16px;color:var(--muted)}

/* ── PESTAÑAS ───────────────────────────────────────────────────────────── */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:var(--s5);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:var(--r8) var(--r8) 0 0}
.tab:hover{color:var(--m)}
.tab.active{color:var(--e);border-bottom-color:var(--e)}

/* ── MODAL (UX-04) ──────────────────────────────────────────────────────── */
.modal-ov{position:fixed;inset:0;background:rgba(7,14,70,.5);z-index:700;display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow-y:auto}
.modal{background:var(--w);border-radius:var(--r20);width:100%;max-width:560px;box-shadow:var(--sh-modal);display:flex;flex-direction:column}
.modal.wide{max-width:920px}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s5);border-bottom:1px solid var(--border)}
.modal-h h2{font-family:var(--f-head);font-size:20px;line-height:28px}
.modal-b{padding:var(--s5)}
.modal-f{display:flex;align-items:center;justify-content:flex-end;gap:var(--s2);padding:var(--s4) var(--s5);border-top:1px solid var(--border);background:var(--sand);border-radius:0 0 var(--r20) var(--r20);flex-wrap:wrap}
.modal-f .left{margin-right:auto}

/* ── TOASTS ─────────────────────────────────────────────────────────────── */
#toasts{position:fixed;right:24px;bottom:24px;z-index:800;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--m);color:var(--w);padding:12px 16px;border-radius:var(--r16);box-shadow:var(--sh-modal);font-size:13px;line-height:20px;animation:tin .2s ease-out}
.toast .ic{margin-top:1px}
.toast.ok .ic{color:var(--lime)}.toast.warn .ic{color:var(--mand)}.toast.err .ic{color:#FF9AA5}.toast.info .ic{color:var(--aqua)}
.toast button{margin-left:auto;border:0;background:none;color:rgba(255,255,255,.7);cursor:pointer}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* ── WIZARD ─────────────────────────────────────────────────────────────── */
.steps{display:flex;gap:4px;margin-bottom:var(--s5);overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:112px;display:flex;flex-direction:column;gap:6px;border:0;background:none;text-align:left;cursor:pointer;padding:0;color:var(--muted)}
.step .bar{height:4px;border-radius:var(--rpill);background:var(--border)}
.step .st-l{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:700}
.step .st-n{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;background:var(--w)}
.step.done .bar{background:var(--green)}.step.done .st-n{background:var(--green);border-color:var(--green);color:var(--w)}
.step.cur .bar{background:var(--e)}.step.cur{color:var(--e)}.step.cur .st-n{border-color:var(--e)}
.step[disabled]{cursor:not-allowed}
.console{background:#0B1020;color:#C9F3DF;border-radius:var(--r8);padding:var(--s4);font-family:var(--f-mono);font-size:12px;line-height:18px;white-space:pre-wrap;min-height:140px;max-height:360px;overflow:auto}
.console .c{color:#7E8BAE}.console .ok{color:#88E783}.console .k{color:#8BE1E9}.console .er{color:#FF9AA5}

/* ── SPLIT / BANDEJAS ───────────────────────────────────────────────────── */
.split{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:var(--s5);align-items:start}
.inbox-item{display:block;width:100%;text-align:left;border:1px solid var(--border);border-radius:var(--r16);padding:var(--s4);background:var(--w);cursor:pointer;margin-bottom:var(--s2)}
.inbox-item:hover{border-color:#B9C3D8}
.inbox-item.sel{border-color:var(--e);background:var(--blue-light)}

/* ── GRAFO DE RELACIONES ────────────────────────────────────────────────── */
.chain{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2);padding:var(--s4);background:var(--sand);border:1px solid var(--border);border-radius:var(--r16)}
.node{border:2px solid var(--e);background:var(--w);border-radius:var(--r8);padding:8px 12px;min-width:120px;cursor:pointer;text-align:left}
.node:hover{box-shadow:var(--sh-hover)}
.node.st-degraded{border-color:var(--amber)}.node.st-down{border-color:var(--red)}.node.st-sandbox,.node.st-draft{border-color:var(--aqua-tx);border-style:dashed}.node.st-inactive{border-color:#9AA6C0}
.node .n-n{font-weight:700;font-size:13px;line-height:18px}
.node .n-s{font-size:11px;line-height:14px;color:var(--muted)}
.edge{display:flex;flex-direction:column;align-items:center;font-size:10px;line-height:12px;color:var(--muted);min-width:64px;text-align:center}
.edge .ic{color:var(--e)}

/* ── FLUJO DE TRAZA ─────────────────────────────────────────────────────── */
.flow{position:relative;padding-left:36px}
.flow::before{content:'';position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:var(--border)}
.fnode{position:relative;margin-bottom:var(--s3)}
.fnode .f-dot{position:absolute;left:-36px;top:12px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--w);border:2px solid var(--border);color:var(--muted)}
.fnode.orq .f-dot{border-color:var(--purp);color:var(--purp-tx);background:var(--purp-bg)}
.fnode.agt .f-dot{border-color:var(--e);color:var(--e);background:var(--blue-light)}
.fnode.hitl .f-dot{border-color:var(--amber);color:var(--amber-tx);background:var(--amber-bg)}
.fnode.err .f-dot{border-color:var(--red);color:var(--red-tx);background:var(--red-bg)}
.fcard{border:1px solid var(--border);border-radius:var(--r16);padding:var(--s3) var(--s4);background:var(--w);display:flex;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
.fmeta{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.fmeta b{color:var(--m);font-variant-numeric:tabular-nums}
.gantt{display:flex;flex-direction:column;gap:6px}
.gantt-row{display:grid;grid-template-columns:180px 1fr 70px;gap:var(--s3);align-items:center;font-size:12px}
.gantt-track{height:14px;background:var(--sand);border-radius:var(--rpill);position:relative}
.gantt-bar{position:absolute;top:0;bottom:0;border-radius:var(--rpill);background:var(--e)}

/* ── ESTUDIO ────────────────────────────────────────────────────────────── */
.studio{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:var(--s5);align-items:start}
.chat{display:flex;flex-direction:column;height:calc(100vh - 260px);min-height:520px}
.chat-log{flex:1;overflow-y:auto;padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);background:var(--sand);border-radius:var(--r16) var(--r16) 0 0;border:1px solid var(--border);border-bottom:0}
.msg{max-width:86%;padding:10px 14px;border-radius:var(--r16);font-size:14px;line-height:21px}
.msg.bot{background:var(--w);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--e);color:var(--w);align-self:flex-end;border-bottom-right-radius:4px}
.msg .who{font-size:11px;line-height:14px;font-weight:700;color:var(--muted);margin-bottom:2px;display:flex;align-items:center;gap:4px}
.msg.me .who{color:rgba(255,255,255,.75)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chat-in{display:flex;gap:var(--s2);padding:var(--s3);border:1px solid var(--border);border-radius:0 0 var(--r16) var(--r16);background:var(--w)}
.chat-in textarea{min-height:44px;height:44px;resize:none}
.live{position:sticky;top:calc(var(--topbar-h) + 16px)}
.live .lf{padding:10px 0;border-bottom:1px solid var(--border)}
.live .lf:last-child{border-bottom:0}
.live .lf-k{font-size:12px;line-height:16px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:6px}
.live .lf-v{font-size:14px;line-height:20px;outline:none;border-radius:4px;padding:2px 4px;margin:0 -4px;min-height:24px}
.live .lf-v:hover{background:var(--sand)}
.live .lf-v:focus{background:var(--blue-light)}
.live .lf-v.empty{color:var(--muted);font-style:italic}
.live .lf.flash .lf-v{animation:flash 1.2s}
@keyframes flash{0%{background:#FFF3C4}100%{background:transparent}}
.semaforo{display:flex;gap:6px}
.semaforo span{flex:1;height:8px;border-radius:var(--rpill);background:var(--border)}
.semaforo.s1 span:nth-child(1){background:var(--amber)}
.semaforo.s2 span:nth-child(-n+2){background:var(--purp)}
.semaforo.s3 span{background:var(--green)}
.example{display:grid;grid-template-columns:1fr auto 1fr auto;gap:var(--s3);align-items:center;padding:var(--s3);border:1px solid var(--border);border-radius:var(--r8);margin-bottom:var(--s2)}
.example.never{border-color:#F0C2C9;background:#FFF8F9}
.diff-add{color:var(--green-tx)}.diff-del{color:var(--red-tx);text-decoration:line-through}
.choose-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}
.choose{border:1px solid var(--border);border-radius:var(--r16);padding:var(--s5);background:var(--w);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:var(--s2);min-height:150px}
.choose:hover{box-shadow:var(--sh-hover);border-color:#C9D2E3}
.choose .h-card{font-size:15px}
.term{border-bottom:1px dotted var(--muted);cursor:help}
.progress{height:8px;border-radius:var(--rpill);background:var(--gray-bg);overflow:hidden}
.progress span{display:block;height:100%;background:var(--e);border-radius:var(--rpill)}
.progress.ok span{background:var(--green)}.progress.warn span{background:var(--amber)}.progress.err span{background:var(--red)}

/* ── RESPONSIVE (UX-07, HOME-12) ────────────────────────────────────────── */
@media (max-width:1359px){
  #tb-country .cname{display:none}
  .nv-btn{padding:0 8px}
}
@media (max-width:1240px){
  .grid12 > .c3{grid-column:span 6}
  .grid12 > .c4,.grid12 > .c5,.grid12 > .c7,.grid12 > .c8,.grid12 > .c9{grid-column:span 12}
  .g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .studio{grid-template-columns:1fr}
  .live{position:static}
}
@media (max-width:1199px){
  #tb-user .cname{display:none}
}
@media (max-width:1100px){
  :root{--topbar-h:60px}
  #nav{display:none;position:fixed;top:60px;left:0;right:0;bottom:0;background:var(--m);flex-direction:column;align-items:stretch;padding:var(--s4);overflow:auto;margin:0;z-index:350}
  .tb-row2{display:block;height:0;padding:0;border:0;background:none;overflow:visible}
  #nav.open{display:flex}
  #nav .nv-btn{height:44px;font-size:15px;width:100%}
  #nav .dd{position:static;display:block;box-shadow:none;margin:4px 0 12px;min-width:0}
  #tb-menu-btn{display:flex}
}
@media (max-width:880px){
  #tb-brand .name-wrap,#tb-brand .div{display:none}
  .split{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr}
}
@media (max-width:640px){
  :root{--topbar-h:56px}
  .tb-row1{height:56px}
  #main{padding:var(--s4)}
  .tb-row1{padding:0 var(--s4);gap:var(--s2)}
  .grid12 > .c3,.grid12 > .c4,.grid12 > .c6,.grid12 > .c12{grid-column:span 12}
  .g2,.g4,.g5{grid-template-columns:1fr}
  .tile-metric{font-size:32px}
  .modal-ov{padding:16px 8px}
  .chat{height:auto;min-height:0}
  .chat-log{max-height:60vh}
  .gantt-row{grid-template-columns:110px 1fr 56px}
  .example{grid-template-columns:1fr}
}
/* ── Rejillas equilibradas de KPIs y filtros ────────────────────────────────
   Las columnas se calculan según el nº de elementos (con :has) para que ninguna
   fila quede con un único elemento descolgado. */
@media (min-width:1200px){
  :is(.kpis,.filters):has(>:nth-child(1):last-child){grid-template-columns:minmax(0,1fr)}
  :is(.kpis,.filters):has(>:nth-child(2):last-child){grid-template-columns:repeat(2,minmax(0,1fr))}
  :is(.kpis,.filters):has(>:nth-child(3):last-child){grid-template-columns:repeat(3,minmax(0,1fr))}
  :is(.kpis,.filters):has(>:nth-child(4):last-child){grid-template-columns:repeat(4,minmax(0,1fr))}
  :is(.kpis,.filters):has(>:nth-child(5):last-child){grid-template-columns:repeat(5,minmax(0,1fr))}
  :is(.kpis,.filters):has(>:nth-child(6):last-child){grid-template-columns:repeat(6,minmax(0,1fr))}
  :is(.kpis,.filters):has(>:nth-child(7):last-child){grid-template-columns:repeat(7,minmax(0,1fr))}
  .filters:has(>:nth-child(8):last-child){grid-template-columns:repeat(8,minmax(0,1fr))}
  .kpis:has(>:nth-child(8):last-child){grid-template-columns:repeat(4,minmax(0,1fr))}
  :is(.kpis,.filters):has(>:nth-child(9):last-child){grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (min-width:700px) and (max-width:1199px){
  :is(.kpis,.filters){grid-template-columns:repeat(12,minmax(0,1fr))}
  :is(.kpis,.filters) > *{grid-column:span 4}
  :is(.kpis,.filters):has(>:nth-child(2):last-child) > *,
  :is(.kpis,.filters):has(>:nth-child(4):last-child) > *{grid-column:span 6}
  :is(.kpis,.filters):has(>:nth-child(5):last-child) > :nth-child(n+4){grid-column:span 6}
  :is(.kpis,.filters):has(>:nth-child(7):last-child) > :nth-child(-n+4){grid-column:span 3}
  :is(.kpis,.filters):has(>:nth-child(8):last-child) > *{grid-column:span 3}
}
@media (max-width:699px){
  :is(.kpis,.filters){grid-template-columns:repeat(2,minmax(0,1fr))}
  :is(.kpis,.filters) > :last-child:nth-child(odd){grid-column:1/-1}
  .choose-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:480px){
  .choose-grid{grid-template-columns:minmax(0,1fr)}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  if(s < 3600) return `hace ${Math.floor(s/60)} min`;
  if(s < 86400) return `hace ${Math.floor(s/3600)} h`;

};

// ── Refresco (RN-05): cada 60 s; contador "Actualizado hace X s" ─────────────
function healthTick() {
  AGENTS.forEach(a => {
    if(a.state === 'active' || a.state === 'degraded') {
      a.lat = Math.max(40, Math.round((a.lat || 150) + (Math.random() - .5) * 8));
      a.exito = Math.min(99.9, Math.max(80, +((a.exito || 97) + (Math.random() - .5) * .3).toFixed(1)));
      a.lastCheckS = Math.round(Math.random() * 20);
    }
  });
  runScheduled();
}
function refreshAll(force) {
  healthTick(); S.lastRefresh = Date.now();
  const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  const m = VIEW_META[S.route.id];
  if(!modalOpen() && !typing && (force || (m && m.live))) rerender(); else updateFresh();
}
ACT.refresh = () => { refreshAll(true); toast('Datos actualizados desde el Registry.', 'info', 2200); };
function updateFresh() {
  const s = Math.round((Date.now() - S.lastRefresh) / 1000);
  $$('[data-fresh] span').forEach(e => e.textContent = `Actualizado hace ${s} s`);
}
setInterval(updateFresh, 1000);

function runScheduled() {
  SCHEDULED.filter(s => s.estado === 'Programada' && s.cuando <= Date.now()).forEach(s => {
    const a = agentById(s.agId); if(!a) return;
    if(s.accion === 'Encender') { if(a.retired || a.blocked || !a.certified || a.pendingIncorporation) { s.estado = 'No ejecutada'; logAction({agente:a.nombre, agId:a.id, accion:'Encendido programado no ejecutado', pais:s.paises.join(', '), motivo:'No se cumplen los prerrequisitos de encendido', res:'Error'}); return; } a.state = 'active'; }
    if(s.accion === 'Apagar') a.state = 'inactive';
    s.estado = 'Ejecutada';
    logAction({agente:a.nombre, agId:a.id, accion:`${s.accion} (programado)`, pais:s.paises.join(', '), user:s.user, motivo:s.motivo});
  });
}

// ── Estadísticas calculadas desde los datos (HOME-08) ────────────────────────
const invocFor = a => a.paises.length > 1 && S.country !== 'ALL' ? (a.invoc || 0) / a.paises.length : (a.invoc || 0);
function activeAlerts() { return ALERTS.filter(a => a.estado !== 'Resuelta' && cOK(a.pais)); }
function pendingHitl() { return HITL.filter(h => h.estado === 'Pendiente' && cOK(h.pais) && hitlVisible(h)); }
function hitlVisible(h) { const a = agentById(h.agent); return isCorp() || !a || inScope(a); }
function openIssues() { return ISSUES.filter(i => ['Abierto','En curso'].includes(i.estado) && (() => { const a = agentById(i.agId); return a && inCountry(a) && (isCorp() || inScope(a)); })()); }
function perfStats() {
  const ag = visibleAgents().filter(a => ['active','degraded'].includes(a.state) && a.invoc > 0 && (isCorp() || inScope(a)));
  const inv = sum(ag, invocFor);
  const w = f => inv ? sum(ag, a => f(a) * invocFor(a)) / inv : null;
  const exito = w(a => a.exito), lat = w(a => a.lat);
  const delta = ((hash(S.country + 'perf') % 9) - 3) / 10;
  return {inv, exito, lat, delta, n:ag.length};
}
function costStats() {
  const cs = S.country === 'ALL' ? PAISES.map(p => p.c) : [S.country];
  const gasto = sum(cs, c => GASTO_PAIS[c]), pres = sum(cs, c => PRESUPUESTO_PAIS[c]);
  const inv = sum(AGENTS.filter(a => ['active','degraded'].includes(a.state) && inCountry(a)), invocFor) * 30;
  return {gasto, pres, pctPres:pres ? gasto / pres * 100 : 0, porSol:inv ? gasto / inv : 0};
}
function valueStats() {
  const m = VALUE_MODEL; if(!m) return null;
  const ag = visibleAgents().filter(a => a.state === 'active' && m.minutos[a.id]);
  const ahorro = sum(ag, a => invocFor(a) * 30 * m.minutos[a.id] / 60 * m.costeHora);
  return {ahorro, n:ag.length};
}
function parqueStats() {
  const ag = visibleAgents();
  const c = {}; ESTADOS.forEach(s => c[s] = ag.filter(a => a.state === s).length);
  return {total:ag.length, c};
}
function approvalsForMe() {
  const mine = APPROVALS.filter(a => a.estado === 'Pendiente' && a.solicitante === S.persona.id);
  return mine;
}
const canSeeApprovals = () => ['ROL-01','ROL-05'].includes(role()) || ['ROL-02','ROL-03','ROL-07'].includes(role());
const ageLabel = ts => { const h = ageH(ts); return h < 1 ? `${Math.max(1, Math.round(h * 60))} min` : h < 48 ? `${Math.round(h)} h` : `${Math.round(h / 24)} d`; };

function tile(o) {
  if(S.homeLoading) return `<div class="tile" aria-busy="true"><div class="row" style="flex-wrap:nowrap"><div class="skel" style="width:40px;height:40px;border-radius:50%"></div><div class="skel skel-line" style="width:50%"></div></div><div class="skel skel-metric"></div><div class="skel skel-line" style="width:80%"></div><div class="skel skel-line"></div></div>`;
  if(S.errTiles.has(o.id)) return `<div class="tile" style="cursor:default"><div class="tile-h"><span class="ic-round gray">${ic(o.icon)}</span><span class="h-card">${o.title}</span></div>${errBox('No disponible', true)}</div>`;
  const zero = o.zero && o.metricRaw === 0;

  return `<div class="tile" ${o.go} tabindex="0" role="link" aria-label="${esc(o.title)}: ${esc(String(o.metricTxt || o.metric))}">
    <div class="tile-h"><span class="ic-round ${o.tint || ''}">${ic(o.icon)}</span><span class="h-card" title="${esc(o.title)}">${o.title}</span></div>

}

function safe(id, fn) {
  if(S.errTiles.has(id)) return fn.call(null, true);

}
function compact(o) {

}

function executeApproval(a) {

  if(a.tipo === 'publicacion') { if(a.payload.wfId) completePublication(a); else if(ag) { ag.state = 'active'; ag.pendingIncorporation = false; ag.lat = ag.lat || 150; ag.exito = ag.exito || 97.5; ag.pilot = 10; ag.obs = {until:Date.now() + ADM_PARAMS.ventanaObs * 86400000, prev:'sandbox', mod:'Publicación'}; logAction({agente:ag.nombre, agId:ag.id, accion:'Publicado (activo)', pais:ag.paises.join(', '), motivo:a.motivo, trace:a.trace}); } toast('Publicación aprobada: el agente pasa a activo.', 'ok', 5000); }
  if(a.tipo === 'reglas') { const r = ROUTING_RULES.find(x => x.id === a.payload.ruleId); if(r) { if(a.payload.op === 'baja') { ROUTING_RULES.splice(ROUTING_RULES.indexOf(r), 1); } else { if(a.payload.next) Object.assign(r, a.payload.next); r.estado = 'Activa'; if(a.payload.next) { r.v++; r.hist.unshift({v:r.v, by:a.solicitanteN, ts:Date.now(), m:a.motivo}); } } } toast('Regla de enrutamiento aprobada y vigente.', 'ok'); }
  if(a.tipo === 'rbac_lateral') { if(a.payload.add) RELATIONS.push(Object.assign({id:'REL-' + String(RELATIONS.length + 1).padStart(2, '0'), journey:'Nuevo'}, a.payload.add)); if(a.payload.remove) { const i = RELATIONS.findIndex(r => r.id === a.payload.remove); if(i >= 0) RELATIONS.splice(i, 1); } toast('Permiso lateral actualizado en el Registry.', 'ok'); }

ACT.healthSim = () => {
  const act = AGENTS.filter(a => a.state === 'active' && a.lat), deg = AGENTS.filter(a => a.state === 'degraded');
  if(deg.length && Math.random() < .5) { const a = deg[0]; a.state = 'active'; a.lat = Math.round(a.lat * .6); toast(`Agente de Salud: ${esc(a.nombre)} vuelve a «Activo».`, 'info', 5000); }
  else if(act.length) { const a = act[Math.floor(Math.random() * act.length)]; a.state = 'degraded'; a.lat = Math.round(umbral(a).latenciaMs * 1.1 || 330); ALERTS.unshift({id:uid('AL'), tipo:'Degradación', sev:'Alta', titulo:`${a.nombre} · Latencia anómala`, desc:`El Agente de Salud marcó «degradado»: latencia ${a.lat} ms sobre el umbral.`, agId:a.id, pais:a.paises, ts:Date.now(), estado:'Nueva', asign:null, coment:[], cod:'ALT-03'}); toast(`Agente de Salud: ${esc(a.nombre)} pasa a «Degradado» por latencia. Se genera la alerta ALT-03.`, 'warn', 6000); }

};

  if(tab === 'reglas') body = `<div class="card flush"><div class="card-h"><h3>Repositorio de reglas deterministas</h3>${canReglas() ? `<button class="btn btn-p btn-sm" ${da('ruleNew')}>${ic('plus')}Nueva regla</button>` : ''}</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>ID</th><th>Regla</th><th>Condición</th><th>Agente por defecto</th><th class="num">Prioridad</th><th>Estado</th><th class="num">Versión</th><th class="actions"></th></tr></thead><tbody>${ROUTING_RULES.map(r => `<tr><td class="mono">${r.id}</td><td class="cell-main">${esc(r.nombre)}</td><td class="mono t-sm">${esc(condTxt(r.cond))}</td><td>${agentLink(agentById(r.agent))}</td><td class="num">P${r.prio}</td><td><span class="badge ${RULE_CLS[r.estado]}">${r.estado}</span></td><td class="num">v${r.v}</td><td class="actions"><button class="btn btn-s btn-xs" ${da('ruleHist', r.id)}>Histórico</button>${canReglas() ? `<button class="btn btn-s btn-xs" ${da('ruleEdit', r.id)}>Editar</button><button class="btn btn-ds btn-xs" ${da('ruleDel', r.id)}>Baja</button>` : ''}</td></tr>`).join('')}</tbody></table></div><div class="pager"><span class="t-sm t-muted">${ic('lock','s14')} Las altas, cambios y bajas piden motivo y doble validación; el Orquestador no cambia su configuración por su cuenta (RN-15).</span></div></div>`;

  if(tab === 'n2') body = `<div class="card flush"><div class="card-h"><h3>Decisiones del clasificador (Nivel 2)</h3><span class="t-sm t-muted">Solo cuando ninguna regla aplica</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Resumen de la petición</th><th>Agente elegido</th><th class="num">Confianza</th><th>Candidatos del Registry evaluados</th><th>Fecha</th><th>trace_id</th></tr></thead><tbody>${LLM_DECISIONS.map(d => `<tr><td style="max-width:300px;white-space:normal">${esc(d.resumen)}</td><td>${agentLink(agentById(d.agent))}</td><td class="num"><span class="badge ${d.conf >= .85 ? 'b-ok' : d.conf >= .7 ? 'b-warn' : 'b-err'}">${fmt(d.conf, 2)}</span></td><td>${d.cands.map(c => { const a = agentById(c[0]); return `<div class="t-sm">${esc(a ? a.nombre : c[0])} · ${a ? ESTADO_LBL[a.state] : ''} · ${a && a.exito ? pct(a.exito) : '—'} · <b>${fmt(c[1], 2)}</b></div>`; }).join('')}</td><td>${relTxt(d.ts)}</td><td><button class="link mono" ${da('go','audit',d.trace)}>${d.trace}</button></td></tr>`).join('')}</tbody></table></div></div>`;
  if(tab === 'rbac') body = `<div class="card mb24"><div class="card-h"><h3>Matriz de RBAC de entrada</h3><span class="t-sm t-muted">Comprobación determinista, sin LLM</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Operación</th>${CANALES.map(c => `<th style="text-align:center">${c}</th>`).join('')}</tr></thead><tbody>${OPERACIONES.map(o => `<tr><td class="mono">${o}</td>${CANALES.map(c => `<td style="text-align:center">${APPROVALS.some(a => a.estado === 'Pendiente' && a.tipo === 'rbac_entrada' && a.payload.op === o && a.payload.canal === c) ? '<span class="badge b-warn">Pendiente</span>' : `<label class="toggle" style="justify-content:center"><input type="checkbox" ${RBAC_ENTRADA[o][c] ? 'checked' : ''} ${canReglas() ? '' : 'disabled'} data-change="rbacTog" data-a="${o}" data-b="${c}" aria-label="${o} por ${c}"><span class="tr"></span></label>`}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="t-sm t-muted" style="padding:12px 0 0">Cada cambio se envía a aprobación: no se aplica hasta que otra persona lo autorice.</div></div>
    <div class="card flush"><div class="card-h"><h3>Peticiones rechazadas por RBAC</h3></div><div class="tbl-wrap short"><table class="tbl"><thead><tr><th>Cuándo</th><th>Canal</th><th>Operación</th><th>País</th><th>trace_id</th></tr></thead><tbody>${RBAC_RECHAZOS.filter(r => cOK(r.pais)).map(r => `<tr><td>${relTxt(r.ts)}</td><td>${r.canal}</td><td class="mono">${r.op}</td><td>${flag(r.pais)} ${r.pais}</td><td class="mono">${r.trace}</td></tr>`).join('') || `<tr><td colspan="5">${emptyBox('Sin rechazos', '')}</td></tr>`}</tbody></table></div></div>`;
  if(tab === 'modo') body = `<div class="card flush"><div class="card-h"><h3>Modo de respuesta por tipo de operación</h3><span class="t-sm t-muted">Parámetro declarado: el modo no se decide en caliente</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Operación</th><th>Modo actual</th><th>Cambio</th></tr></thead><tbody>${OPERACIONES.map(o => { const pend = APPROVALS.find(a => a.estado === 'Pendiente' && a.tipo === 'modo' && a.payload.op === o); return `<tr><td class="mono">${o}</td><td><span class="badge ${MODO_RESPUESTA[o] === 'directo' ? 'b-info' : 'b-orq'}">${MODO_RESPUESTA[o]}</span></td><td>${pend ? `<span class="badge b-warn">Pendiente: ${pend.payload.nuevo}</span>` : canReglas() ? `<button class="btn btn-s btn-xs" ${da('modoCh', o)}>Cambiar a ${MODO_RESPUESTA[o] === 'directo' ? 'diferido' : 'directo'}</button>` : ''}</td></tr>`; }).join('')}</tbody></table></div></div>`;
  if(tab === 'fb') { const c = FALLBACK_CFG; body = `<div class="grid g2"><div class="card"><div class="card-h"><h3>Cadena de fallback de cuatro niveles</h3>${canReglas() ? `<button class="btn btn-s btn-sm" ${da('fbEdit')}>${ic('pencil')}Editar parámetros</button>` : ''}</div><div class="timeline">${[['Nivel 1 · Reintento', `${c.reintentos} reintentos con espera exponencial: ${c.esperaBaseMs} ms × ${c.factor}.`], ['Nivel 2 · Agente alternativo', `Con la ${c.tipoAlt}.`], ['Nivel 3 · Escalado a HITL', c.escalaHitl ? 'Activado: el flujo pasa a revisión humana.' : 'Desactivado.'], ['Nivel 4 · Error controlado', c.errorControlado]].map(x => `<div class="tl-i done"><span class="tl-dot">${ic('check')}</span><div class="tl-t">${x[0]}</div><div class="tl-d">${x[1]}</div></div>`).join('')}</div></div>
    <div class="card flush"><div class="card-h"><h3>Peticiones resueltas por fallback</h3><span class="t-sm t-muted">RUT-08</span></div><div class="tbl-wrap short"><table class="tbl"><thead><tr><th>Cuándo</th><th>Operación</th><th>Agente</th><th>Desenlace</th></tr></thead><tbody>${ROUTING_FALLBACKS.map(r => `<tr><td>${relTxt(r.ts)}</td><td class="mono">${r.op}<div class="cell-sub"><button class="link" ${da('go','audit',r.trace)}>${r.trace}</button></div></td><td>${agentLink(agentById(r.agent))}</td><td>${esc(r.resultado)}<div class="cell-sub">Nivel ${r.nivel}</div></td></tr>`).join('')}</tbody></table></div></div></div>`; }

  chart('ch-rt-tr', {type:'line', data:{labels:DIAS7, datasets:[{label:'Precisión (%)', data:k.trend.acc, borderColor:CH.e, backgroundColor:CH.e, tension:.35, yAxisID:'y'}, {label:'Decisión (ms)', data:k.trend.lat, borderColor:CH.aqua, backgroundColor:CH.aqua, tension:.35, yAxisID:'y1'}, {label:'% Nivel 1', data:k.trend.n1, borderColor:CH.lime, backgroundColor:CH.lime, tension:.35, yAxisID:'y', borderDash:[4, 3]}]}, options:{plugins:{legend:{position:'bottom'}}, scales:{y:{position:'left', min:70, max:100}, y1:{position:'right', min:0, max:80, grid:{drawOnChartArea:false}}}}});
});
ACT.simRun = () => {
  const op = val('sm-o'), dom = val('sm-d'), canal = val('sm-c'), txt = val('sm-t').trim(); const out = $('#sm-out');
  if(!RBAC_ENTRADA[op][canal]) { out.innerHTML = `<div class="state-box err">${ic('lock')}<div class="st-t">Rechazada por el RBAC de entrada</div><div>El canal «${canal}» no puede pedir «${op}». No se enruta ni se llama al LLM.</div></div>`; return; }
  const rule = ROUTING_RULES.filter(r => r.estado === 'Activa' && r.cond.op === op && (r.cond.dom === '*' || r.cond.dom === dom) && (r.cond.canal === '*' || r.cond.canal === canal)).sort((a, b) => a.prio - b.prio)[0];
  const trace = newTrace();
  if(rule) { const a = agentById(rule.agent); out.innerHTML = simOut(1, `Regla ${rule.id}: ${condTxt(rule.cond)}`, a, 0.99, 'Coincidencia determinista con una regla activa. Sin llamada al LLM: coste cero y resultado auditable.', [], trace); return; }
  const words = kw(txt + ' ' + op.replace(/_/g, ' ') + ' ' + dom);
  const cands = AGENTS.filter(a => !a.retired && a.state !== 'draft').map(a => { const s = kw(a.nombre + ' ' + a.desc + ' ' + a.skills.join(' ') + ' ' + a.dominio); const c = words.filter(w => s.some(y => y.startsWith(w.slice(0, 5)))).length; return {a, c, p:Math.min(.97, (a.dominio === dom ? .35 : .05) + c * .17 + (a.state === 'active' ? .08 : -.1))}; }).sort((x, y) => y.p - x.p).slice(0, 4);
  const best = cands[0];
  if(!best || best.p < .5 || best.a.state !== 'active') { out.innerHTML = simOut(2, 'Ninguna regla aplica. El clasificador no alcanza la confianza mínima.', null, best ? best.p : 0, 'Si ningún nivel resuelve se aplica el fallback configurado: derivar al Servicio HITL o devolver un error controlado con código de reintento. Ninguna petición se pierde.', cands, trace, true); return; }
  out.innerHTML = simOut(2, 'Sin regla determinista: se escala al clasificador de Nivel 2', best.a, best.p, `El clasificador razonó sobre la petición y sobre el catálogo del Registry (estado activo y tasa de éxito reciente) y eligió el candidato de mayor afinidad.`, cands, trace);
};
function simOut(n, regla, a, conf, motivo, cands, trace, fb) {
  return `<div class="card-h"><h3>Resultado</h3><span class="badge ${n === 1 ? 'b-blue' : 'b-orq'}">Nivel ${n}</span></div><div class="kv mb16">${kvh('Regla o razonamiento', esc(regla))}${kvh('Agente elegido', a ? agentLink(a) : '<span class="t-err">Ninguno</span>')}${kvh('Estado del agente', a ? stBadge(a) : '—')}${kvh('Fallback', a && a.fallback ? esc(agentName(a.fallback)) : fb ? 'HITL o error controlado' : 'Sin agente alternativo')}${kvh('trace_id (simulado)', `<span class="mono">${trace}</span>`)}</div>
    <div class="overline mb8">Confianza</div><div class="row mb16" style="flex-wrap:nowrap"><b style="font-size:20px">${fmt(conf, 2)}</b><div class="progress ${conf >= .85 ? 'ok' : conf >= .6 ? 'warn' : 'err'} grow"><span style="width:${conf * 100}%"></span></div></div><p class="mb16">${esc(motivo)}</p>
    ${cands.length ? `<div class="overline mb8">Candidatos evaluados del Registry</div>${cands.map(c => `<div class="list-item"><div class="grow">${esc(c.a.nombre)} ${stBadge(c.a)}</div><span class="t-sm t-muted">${c.a.exito ? pct(c.a.exito) : '—'}</span><b class="num">${fmt(c.p, 2)}</b></div>`).join('')}` : ''}`;
}

    <div class="card"><div class="card-h"><h3>Estados del Registry</h3><span class="t-sm t-muted">Anexo B.2</span></div>${ESTADOS.map(s => `<div class="list-item"><span class="badge ${ESTADO_CLS[s]}">${ic(ESTADO_ICON[s])}${ESTADO_LBL[s]}</span><div class="grow t-sm mono">${s}</div><span class="t-sm t-muted">${s === 'active' ? 'Enrutable' : s === 'degraded' ? 'Según fallback' : 'No enrutable'}</span></div>`).join('')}</div></div>`;
  if(tab === 'estudio') body = `<div class="grid g2"><div class="card"><div class="card-h"><h3>Umbral de pruebas</h3><span class="t-sm t-muted">ADM-07</span></div><div class="field"><label for="es-u">Superación mínima para poder enviar a aprobación (%)</label><input class="inp" id="es-u" type="number" min="50" max="100" value="${ADM_PARAMS.umbralPruebas}"></div><button class="btn btn-p btn-sm" ${da('esSave')}>Guardar</button></div>
    <div class="card"><div class="card-h"><h3>Guardarraíles por defecto</h3></div>${GUARDARRAILES.map(g => `<div class="list-item"><div class="grow"><b>${g.n}</b><div class="t-sm t-muted">${g.d}</div></div><label class="toggle"><input type="checkbox" ${g.fijo ? 'checked' : ''} data-change="grFijo" data-a="${g.id}"><span class="tr"></span>Obligatorio</label></div>`).join('')}</div></div>`;
  if(tab === 'ambito') body = `<div class="card flush"><div class="card-h"><h3>Ámbito funcional por usuario</h3><span class="t-sm t-muted">ADM-08 · el rol procede del IAM; aquí solo se asigna país y dominio. No sustituye al IAM.</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Usuario</th><th>Rol (IAM)</th><th>Países</th><th>Dominios</th><th class="actions"></th></tr></thead><tbody>${PERSONAS.map(p => `<tr><td><div class="row" style="flex-wrap:nowrap"><span class="avatar" style="width:28px;height:28px">${p.ini}</span><b>${esc(p.name)}</b></div></td><td>${ROLES[p.rol].n}</td><td>${p.paises.length === PAISES.length ? 'Todos' : p.paises.map(c => `${flag(c)} ${c}`).join(' ')}</td><td class="t-sm">${p.dominios === '*' ? 'Todos' : p.dominios.join(', ')}</td><td class="actions"><button class="btn btn-s btn-xs" ${da('ambEdit', p.id)}>Editar ámbito</button></td></tr>`).join('')}</tbody></table></div></div>`;
  if(tab === 'hist') body = `<div class="card flush"><div class="card-h"><h3>Histórico de cambios de configuración</h3><button class="btn btn-s btn-sm" ${da('histExp')}>${ic('download')}Exportar CSV</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Usuario</th><th>Categoría</th><th>Cambio</th><th>Motivo</th></tr></thead><tbody>${ADMIN.historial.map(h => `<tr><td class="num">${dt(h.ts)}</td><td>${esc(h.by)}</td><td><span class="badge outline">${h.cat}</span></td><td style="white-space:normal;max-width:340px">${esc(h.cambio)}</td><td style="white-space:normal;max-width:300px" class="t-sm">${esc(h.motivo)}</td></tr>`).join('')}</tbody></table></div></div>`;
  return pageHead('admin', {noScope:true, noFresh:true}) + `<div class="tabs">${ADM_TABS.map(t => `<button class="tab${tab === t[0] ? ' active' : ''}" ${da('admTab', t[0])}>${t[1]}</button>`).join('')}</div>${body}`;
});
// Países y dominios
ACT.paisAdd = () => { const c = val('pa-c').trim().toUpperCase(), n = val('pa-n').trim(); if(!/^[A-Z]{3}$/.test(c) || !n) { toast('Indica un código de 3 letras y el nombre.', 'warn'); return; } if(PAISES.some(p => p.c === c)) { toast('Ese país ya existe.', 'warn'); return; } admAsk({title:`Alta del país ${c}`, cat:'Países', body:`<p>Se dará de alta <b>${c} · ${esc(n)}</b>. Asígnalo a los usuarios en «Ámbito por usuario» para que lo vean.</p>`, apply:() => { PAISES.push({c, n}); return `Alta de ${c} · ${n}`; }}); };
ACT.paisEdit = el => { const p = PAISES.find(x => x.c === el.dataset.a); admAsk({title:`Editar ${p.c}`, cat:'Países', body:`<div class="field"><label for="pe-n">Nombre</label><input class="inp" id="pe-n" value="${esc(p.n)}"></div>`, apply:() => { const n = val('pe-n').trim(); if(!n) return false; const o = p.n; p.n = n; return `${p.c}: «${o}» → «${n}»`; }}); };
ACT.paisDel = el => { const p = PAISES.find(x => x.c === el.dataset.a); const n = countAgentsIn(p.c); if(n) { toast(`No se puede dar de baja: ${plural(n, 'agente pertenece', 'agentes pertenecen')} a ${p.c}. Todo agente debe pertenecer a un país configurado.`, 'err', 6000); return; } admAsk({title:`Baja de ${p.c}`, cat:'Países', danger:1, ok:'Dar de baja', body:`<p>${p.c} dejará de estar disponible en el selector.</p>`, apply:() => { PAISES.splice(PAISES.indexOf(p), 1); S.persona.paises = S.persona.paises.filter(c => c !== p.c); PERSONAS.forEach(x => { x.paises = x.paises.filter(c => c !== p.c); }); if(S.country === p.c) S.country = isCorp() ? 'ALL' : S.persona.paises[0]; return `Baja de ${p.c}`; }}); };
ACT.domAdd = () => { const n = val('dm-n').trim(); if(!n) return; if(DOMINIOS.includes(n)) { toast('Ese dominio ya existe.', 'warn'); return; } admAsk({title:`Alta del dominio «${n}»`, cat:'Dominios', body:'<p>El dominio estará disponible en altas, filtros y ámbito.</p>', apply:() => { DOMINIOS.push(n); return `Alta del dominio ${n}`; }}); };
ACT.domDel = el => { const d = el.dataset.a; const n = AGENTS.filter(a => a.dominio === d).length; if(n) { toast(`No se puede dar de baja: ${plural(n, 'agente usa', 'agentes usan')} este dominio.`, 'err', 6000); return; } admAsk({title:`Baja del dominio «${d}»`, cat:'Dominios', danger:1, ok:'Dar de baja', apply:() => { DOMINIOS.splice(DOMINIOS.indexOf(d), 1); return `Baja del dominio ${d}`; }}); };
// Taxonomía y plantillas
ACT.tagAdd = () => { const t = val('tg-n').trim().toLowerCase().replace(/\s+/g, '-'); if(!t) return; if(ADMIN.tags.includes(t)) { toast('Esa etiqueta ya existe.', 'warn'); return; } admAsk({title:`Nueva etiqueta «${t}»`, cat:'Taxonomía', apply:() => { ADMIN.tags.push(t); return `Alta de la etiqueta ${t}`; }}); };
ACT.tagDel = el => { const t = el.dataset.a; admAsk({title:`Quitar la etiqueta «${t}»`, cat:'Taxonomía', danger:1, ok:'Quitar', body:`<p>Se retirará también de los agentes que la tengan (${AGENTS.filter(a => a.tags.includes(t)).length}).</p>`, apply:() => { ADMIN.tags = ADMIN.tags.filter(x => x !== t); AGENTS.forEach(a => { a.tags = a.tags.filter(x => x !== t); }); return `Baja de la etiqueta ${t}`; }}); };
ACT.plAdd = () => { const n = val('pl-n').trim(); if(!n) return; admAsk({title:'Nueva plantilla', cat:'Plantillas', apply:() => { ADMIN.plantillasAlta.push(n); return `Alta de la plantilla «${n}»`; }}); };
ACT.ownAdd = () => admAsk({title:'Añadir owner funcional', cat:'Owners', body:`<div class="grid g2"><div class="field"><label for="ow-n" class="req">Owner</label><input class="inp" id="ow-n"></div><div class="field"><label for="ow-s" class="req">Suplente</label><input class="inp" id="ow-s"></div></div><div class="field"><label for="ow-d">Dominio</label><select class="inp" id="ow-d">${optList(DOMINIOS)}</select></div>`, apply:() => { const n = val('ow-n').trim(), s = val('ow-s').trim(); if(!n || !s) { toast('Indica owner y suplente.', 'warn'); return false; } ADMIN.owners.push({n, suplente:s, dominio:val('ow-d')}); return `Alta del owner ${n} (suplente ${s})`; }});
ACT.ownEdit = el => { const o = ADMIN.owners[+el.dataset.a]; admAsk({title:`Suplente de ${o.n}`, cat:'Owners', body:`<div class="field"><label for="ow-s" class="req">Nuevo suplente</label><input class="inp" id="ow-s" value="${esc(o.suplente)}"></div>`, apply:() => { const s = val('ow-s').trim(); if(!s) return false; const a = o.suplente; o.suplente = s; return `Suplente de ${o.n}: ${a} → ${s}`; }}); };
// Umbrales, catálogos, Construcción
ACT.umbSave = () => { const e = +val('um-e'), l = +val('um-l'), h = +val('um-h'), ph = +val('um-ph'), pa = +val('um-pa'), b = +val('um-b'); if(!(e >= 80 && e <= 99.9) || !(l >= 50 && l <= 3000) || !(h > 0) || !(ph > 0) || !(pa > 0) || !(b > 0 && b <= 100)) { toast('Hay valores fuera de rango: éxito 80–99,9 %, latencia 50–3.000 ms y plazos mayores que cero.', 'err', 6000); return; } admAsk({title:'Guardar umbrales y plazos', cat:'Umbrales', body:'<p>Los umbrales por defecto se aplican a los agentes que no tienen uno propio en el Registry.</p>', apply:() => { Object.assign(ADMIN.umbrales, {exito:e, latenciaMs:l, hitlMax:h}); Object.assign(ADM_PARAMS, {plazoHitlH:ph, plazoAprobH:pa, ventanaObs:+val('um-v'), umbralPresupuesto:b}); return `Umbrales: éxito ${e} %, latencia ${l} ms, HITL ${h} %; plazos HITL ${ph} h, aprobaciones ${pa} h; presupuesto ${b} %`; }}); };
ACT.pvAdd = () => { const n = val('pv-n').trim(); if(!n) return; admAsk({title:'Nuevo proveedor', cat:'Catálogos', apply:() => { ADMIN.proveedores.push(n); return `Alta del proveedor ${n}`; }}); };
ACT.mtAdd = () => { const n = val('mt-n').trim(); if(!n) return; admAsk({title:'Nuevo motivo de operación', cat:'Catálogos', apply:() => { ADMIN.motivos.push(n); return `Alta del motivo «${n}»`; }}); };
ACT.accSens = el => { const a = ACCIONES.find(x => x.id === el.dataset.a); const nuevo = el.value, ant = a.sens; el.value = ant; admAsk({title:`Sensibilidad de «${a.n}»`, cat:'Catálogos', body:`<p>Cambiar de <b>${ant}</b> a <b>${nuevo}</b>. Puede cambiar la criticidad mínima de los borradores que usan esta acción.</p>`, apply:() => { a.sens = nuevo; return `Sensibilidad de «${a.n}»: ${ant} → ${nuevo}`; }}); };
ACT.esSave = () => { const u = +val('es-u'); if(!(u >= 50 && u <= 100)) { toast('El umbral debe estar entre 50 y 100 %.', 'err'); return; } admAsk({title:'Umbral de pruebas de Construcción', cat:'Construcción', apply:() => { const a = ADM_PARAMS.umbralPruebas; ADM_PARAMS.umbralPruebas = u; return `Umbral de pruebas: ${a} → ${u} %`; }}); };
ACT.grFijo = el => { const g = GUARDARRAILES.find(x => x.id === el.dataset.a); const nuevo = el.checked, ant = g.fijo; el.checked = ant; admAsk({title:`Guardarraíl «${g.n}»`, cat:'Construcción', body:`<p>${nuevo ? 'Pasará a ser obligatorio: no se podrá desactivar en Construcción.' : 'Dejará de ser obligatorio: quien crea un agente podrá desactivarlo dentro de márgenes.'}</p>`, apply:() => { g.fijo = nuevo; return `Guardarraíl «${g.n}»: ${nuevo ? 'obligatorio' : 'opcional'}`; }}); };
// Ámbito por usuario (ADM-08)
ACT.ambEdit = el => {
  const p = PERSONAS.find(x => x.id === el.dataset.a);
  admAsk({title:`Ámbito de ${p.name}`, wide:true, cat:'Ámbito', body:`<div class="note info mb16">${ic('info')}<div>El rol (<b>${ROLES[p.rol].n}</b>) viene del IAM corporativo y no se modifica aquí. Solo se asigna el ámbito funcional.</div></div><div class="field"><label>Países</label><div class="row">${PAISES.map(c => `<label class="check"><input type="checkbox" name="am-p" value="${c.c}" ${p.paises.includes(c.c) ? 'checked' : ''}>${flag(c.c)} ${c.c}</label>`).join('')}</div></div>
    <div class="field"><label>Dominios</label><label class="check mb8"><input type="checkbox" id="am-all" ${p.dominios === '*' ? 'checked' : ''}>Todos los dominios</label><div class="row">${DOMINIOS.map(d => `<label class="check"><input type="checkbox" name="am-d" value="${d}" ${p.dominios !== '*' && p.dominios.includes(d) ? 'checked' : ''}>${d}</label>`).join('')}</div></div>`,
    apply:() => { const ps = $$('[name=am-p]:checked').map(e => e.value); if(!ps.length) { toast('Asigna al menos un país.', 'warn'); return false; } const all = $('#am-all').checked, ds = $$('[name=am-d]:checked').map(e => e.value); if(!all && !ds.length) { toast('Asigna al menos un dominio o «Todos».', 'warn'); return false; } p.paises = ps; p.dominios = all ? '*' : ds; if(p.id === S.persona.id) { if(S.country !== 'ALL' && !ps.includes(S.country)) S.country = ps[0]; if(S.country === 'ALL' && !isCorp()) S.country = ps[0]; } return `Ámbito de ${p.name}: ${ps.join(', ')} · ${all ? 'todos los dominios' : ds.join(', ')}`; }});
};
ACT.histExp = () => dl('historico_configuracion.csv', [['Fecha','Usuario','Categoría','Cambio','Motivo'], ...ADMIN.historial.map(h => [dt(h.ts), h.by, h.cat, h.cambio, h.motivo])]);

/* ── js/main.js ── */
// Accesibilidad: tiles y elementos con rol de enlace/botón se activan con Enter o Espacio
document.addEventListener('keydown', e => {
  const el = e.target;
  if((e.key === 'Enter' || e.key === ' ') && el.matches && el.matches('div[data-act][role="link"],div[data-act][role="button"]')) { e.preventDefault(); el.click(); }
});
boot();

</script>
</body>
</html>
